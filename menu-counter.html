  td.pr::before{content:'₹ '}
  tr:last-child td{border-bottom:none}
  .upi{text-align:center;font-size:16px;letter-spacing:2px;margin-top:10mm;border-top:3px double #C9A24B;padding-top:6mm;color:#a8822f}
